[package]
name = "g6"
default-run = "g6"
description = "Command-line front end: inspect, census, convert, run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
g6-core.workspace = true
g6-pe.workspace = true
g6-loader.workspace = true
g6-hle.workspace = true
g6-shader = { workspace = true, features = ["host"] }
g6-game.workspace = true
anyhow.workspace = true
blake3.workspace = true
memchr.workspace = true
clap.workspace = true
walkdir.workspace = true
tracing.workspace = true

[features]
# Debug-level logs and the debugging switches (frame capture, stack dumps,
# the host debug layer, scripted keys). Off in a plain release build.
diagnostics = [
    "g6-core/diagnostics",
    "g6-hle/diagnostics",
    "g6-loader/diagnostics",
    "g6-shader/diagnostics",
]

[lints]
workspace = true
