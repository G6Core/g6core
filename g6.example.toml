# Copy to `g6.toml` (git-ignored) and point it at YOUR files.
# Every path must be OUTSIDE the repository; the tools refuse otherwise.
# Environment variables (shown below) take precedence over this file.
# G6_CONFIG selects a different config file.

[paths]
# Your own dump of the title.     env: G6_GAME_DIR
game_dir = 'D:\g6-data\game'

# Derived data. Default: %LOCALAPPDATA%\g6\cache.   env: G6_CACHE_DIR
# cache_dir = 'D:\g6-data\cache'

# What titles save (persistent local storage), kept apart from the cache.
# Default: %LOCALAPPDATA%\g6\data.   env: G6_DATA_DIR
# data_dir = 'D:\g6-data\data'

# Other Xbox Series titles used to test platform-level code.
# env: G6_TEST_TITLES (separated by ';')
test_titles = []
